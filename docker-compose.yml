version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tfs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tfs_db
    ports:
      - "5435:5432"
    volumes:
      - tfs_pgdata:/var/lib/postgresql/data

volumes:
  tfs_pgdata:
    driver: local
